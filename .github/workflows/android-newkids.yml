# 뉴키즈 앱 안드로이드 빌드 → 서명된 AAB (Google Play 올리기용). 업로드 키는 저장소 비밀값에서만 읽음
name: android-newkids-aab
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: 앱 만들기(Expo 사전 빌드)
        working-directory: newkids_app
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo prebuild --platform android --no-install
      - name: 타깃 API 36 및 버전코드 설정
        working-directory: newkids_app
        run: |
          printf '\nandroid.compileSdkVersion=36\nandroid.targetSdkVersion=36\nandroid.buildToolsVersion=36.0.0\nandroid.suppressUnsupportedCompileSdk=36\n' >> android/gradle.properties
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          tail -5 android/gradle.properties
      - name: 서명 설정
        working-directory: newkids_app
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/upload.jks
          python3 - <<'P'
          import re
          p='android/app/build.gradle'; s=open(p).read()
          rel="signingConfigs {\n        release {\n            storeFile file('upload.jks')\n            storePassword System.getenv('KS_PASS')\n            keyAlias 'newkids'\n            keyPassword System.getenv('KS_PASS')\n        }\n"
          assert 'signingConfigs {' in s
          s=s.replace('signingConfigs {\n', rel, 1)
          s,n=re.subn(r'(buildTypes \{.*?release \{.*?)signingConfig signingConfigs\.debug', r'\1signingConfig signingConfigs.release', s, count=1, flags=re.S)
          assert n==1, 'release signing not patched'
          open(p,'w').write(s)
          P
      - name: AAB 만들기
        working-directory: newkids_app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"
      - uses: actions/upload-artifact@v4
        with:
          name: newkids-aab
          path: newkids_app/android/app/build/outputs/bundle/release/app-release.aab
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "aab-${{ github.run_number }}" newkids_app/android/app/build/outputs/bundle/release/app-release.aab --title "aab ${{ github.run_number }}" --notes "android app bundle" --repo "${{ github.repository }}"
